<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Indo Welsh Company - Certificate Verification</title>
<style>
body{font-family:Arial,Helvetica,sans-serif;background:#f4f6f8;margin:0;color:#1f2937}
.wrap{max-width:760px;margin:50px auto;padding:24px}
.card{background:#fff;border-radius:14px;padding:32px;box-shadow:0 8px 30px rgba(0,0,0,.08)}
h1{margin:0 0 8px;font-size:28px}
.sub{color:#667085;margin-bottom:28px}
label{font-weight:600;display:block;margin-bottom:8px}
input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #ccd2d8;border-radius:8px;font-size:16px}
button{margin-top:12px;padding:12px 18px;border:0;border-radius:8px;background:#146c94;color:white;font-weight:700;cursor:pointer}
.result{margin-top:25px;padding:20px;border-radius:10px;background:#f8fafc}
.valid{border-left:5px solid #16a34a}.invalid{border-left:5px solid #dc2626}
.row{display:flex;gap:16px;padding:10px 0;border-bottom:1px solid #e5e7eb}
.key{width:180px;font-weight:700}
.badge{display:inline-block;padding:5px 10px;border-radius:20px;font-weight:700;background:#dcfce7;color:#166534}
.small{font-size:13px;color:#667085;margin-top:25px}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>INDO WELSH COMPANY</h1>
    <div class="sub">Internship Certificate Verification</div>

    <label for="cert">Certificate Number</label>
    <input id="cert" placeholder="Enter certificate number">
    <button onclick="verify()">Verify Certificate</button>

    <div id="result"></div>
    <div class="small">This page verifies certificate records published by Indo Welsh Company.</div>
  </div>
</div>
<script src="certificates.js"></script>
<script>
function verify(){
  const id=document.getElementById('cert').value.trim().toUpperCase();
  const r=document.getElementById('result');
  if(!id){r.innerHTML='<div class="result invalid"><b>Enter a certificate number.</b></div>';return;}
  const c=CERTIFICATES[id];
  if(!c){
    r.innerHTML='<div class="result invalid"><b>Certificate not found.</b><p>No certificate record matches this number.</p></div>';
    return;
  }
  r.innerHTML=`<div class="result valid">
    <div style="font-size:20px;margin-bottom:15px">✓ Certificate is <span class="badge">${c.status}</span></div>
    <div class="row"><div class="key">Certificate No.</div><div>${c.certificateNo}</div></div>
    <div class="row"><div class="key">Name</div><div>${c.name}</div></div>
    ${c.college ? `<div class="row"><div class="key">College</div><div>${c.college}</div></div>` : ''}
    <div class="row"><div class="key">Internship Domain</div><div>${c.domain}</div></div>
    <div class="row"><div class="key">Internship Period</div><div>${c.startDate} – ${c.endDate}</div></div>
    <div class="row"><div class="key">Issued By</div><div>${c.issuedBy}</div></div>
  </div>`;
}
const params=new URLSearchParams(location.search);
const cert=params.get('cert');
if(cert){document.getElementById('cert').value=cert;verify();}
</script>
</body>
</html>
